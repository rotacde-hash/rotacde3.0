<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Área do Parceiro - Login | Rota CDE Transfer</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="assets/admin.css">

    <style>
        body {
            background-color: var(--primary-dark);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius-md);
            max-width: 440px;
            width: 100%;
            padding: 40px 30px;
            box-shadow: var(--shadow-premium);
            text-align: center;
        }

        .login-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .login-logo img {
            height: 48px;
            width: auto;
        }

        .login-logo-text {
            text-align: left;
        }

        .login-logo-brand {
            font-size: 20px;
            font-weight: 800;
            color: var(--text-light);
            letter-spacing: 1px;
            display: block;
        }

        .login-logo-sub {
            font-size: 11px;
            color: var(--primary-gold);
            font-weight: 700;
            letter-spacing: 2px;
            display: block;
        }

        .login-title {
            font-size: 22px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 8px;
        }

        .login-desc {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 24px;
            line-height: 1.4;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-light);
            margin-bottom: 6px;
        }

        .form-control {
            width: 100%;
            padding: 12px;
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius-sm);
            color: var(--text-light);
            font-size: 14px;
            outline: none;
            transition: var(--transition-normal);
        }

        .form-control:focus {
            border-color: var(--primary-gold);
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-gold);
            color: #000;
            border: none;
            border-radius: var(--border-radius-sm);
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition-normal);
        }

        .btn-login:hover {
            background-color: var(--accent-gold);
        }

        .error-message {
            background: rgba(244, 67, 54, 0.15);
            border: 1px solid rgba(244, 67, 54, 0.3);
            color: #f44336;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-logo">
            <img src="../assets/logo_icon.png" alt="Rota CDE Logo">
            <div class="login-logo-text">
                <span class="login-logo-brand">ROTA CDE</span>
                <span class="login-logo-sub">PAINEL DO PARCEIRO</span>
            </div>
        </div>

        <h1 class="login-title">Acesse seus Dados</h1>
        <p class="login-desc">Digite seu e-mail ou o código exclusivo do seu link de parceiro para acessar seu painel de comissões.</p>

        <div id="loginError" class="error-message"></div>

        <form id="partnerLoginForm" onsubmit="handlePartnerLogin(event)">
            <div class="form-group" style="margin-bottom: 16px;">
                <label for="partnerCred">E-mail ou Código do Link (?ref=)</label>
                <input type="text" id="partnerCred" class="form-control" placeholder="Ex: hotel-bella-italia ou seu@email.com" required autofocus>
            </div>

            <div class="form-group" style="margin-bottom: 24px;">
                <label for="partnerPass">Senha de Acesso</label>
                <input type="password" id="partnerPass" class="form-control" placeholder="Digite sua senha de acesso" required style="width: 100%; padding: 12px; background-color: var(--bg-input); border: 1px solid var(--border-color); border-radius: var(--border-radius-sm); color: var(--text-light); font-size: 14px; outline: none; transition: var(--transition-normal);">
            </div>

            <button type="submit" class="btn-login">🔑 Entrar no Painel</button>
        </form>

        <div style="margin-top: 24px; font-size: 13px; color: var(--text-muted); display: flex; flex-direction: column; gap: 12px; align-items: center;">
            <div>
                Ainda não é um parceiro registrado? <br>
                <a href="../parceiros.html" style="color: var(--primary-gold); font-weight: 600;">Cadastre-se gratuitamente aqui</a>
            </div>
            <div style="margin-top: 4px;">
                <a href="../index.html" style="color: var(--text-muted); text-decoration: none; font-weight: 500; font-size: 12px; border: 1px solid var(--border-color); padding: 5px 12px; border-radius: 6px; display: inline-block; transition: all 0.2s ease;">← Voltar ao Site</a>
            </div>
        </div>
    </div>

    <!-- Supabase SDK & Config -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/supabase-config.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Se já tiver sessão de parceiro ativa e válida, redireciona para o painel
            const session = localStorage.getItem('rota_partner_session');
            if (session) {
                try {
                    const data = JSON.parse(session);
                    if (Date.now() < data.expireAt) {
                        window.location.href = 'parceiro-painel.html';
                        return;
                    }
                } catch(e) {}
            }
        });

        function normalize(str) {
            return (str || '')
                .trim()
                .toLowerCase()
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .replace(/[^a-z0-9\s@.-]/g, '')
                .trim();
        }

        async function handlePartnerLogin(e) {
            e.preventDefault();
            const errEl = document.getElementById('loginError');
            const btn = document.querySelector('.btn-login');

            errEl.style.display = 'none';
            btn.textContent = '⏳ Verificando...';
            btn.disabled = true;

            const rawCred = document.getElementById('partnerCred').value.trim();
            const inputPass = document.getElementById('partnerPass').value.trim();
            if (!rawCred) {
                btn.textContent = '🔑 Entrar no Painel';
                btn.disabled = false;
                return;
            }

            const credLower = rawCred.toLowerCase();
            const credNorm = normalize(rawCred).replace(/\s+/g, '-').replace(/-+/g, '-');

            // Coleta lista completa de parceiros (Supabase + localStorage merge)
            let partnersList = [];

            // 1. Tenta Supabase primeiro
            if (typeof supabaseClient !== 'undefined' && supabaseClient) {
                try {
                    const { data, error } = await supabaseClient.from('parceiros').select('*');
                    if (!error && data && data.length > 0) {
                        partnersList = data;
                        // Atualiza cache local
                        localStorage.setItem('rota_parceiros', JSON.stringify(data));
                        console.log(`[Login] ${data.length} parceiros carregados do Supabase.`);
                    } else if (error) {
                        console.warn('[Login] Erro Supabase:', error.message);
                    }
                } catch (err) {
                    console.warn('[Login] Falha de conexão Supabase:', err);
                }
            }

            // 2. Se Supabase não retornou nada, usa localStorage
            if (partnersList.length === 0) {
                try {
                    partnersList = JSON.parse(localStorage.getItem('rota_parceiros') || '[]');
                    console.log(`[Login] ${partnersList.length} parceiros carregados do localStorage.`);
                } catch (e) {
                    partnersList = [];
                }
            }

            console.log('[Login] Lista de parceiros disponíveis:', partnersList.map(p => ({ slug: p.slug, nome: p.nome, email: p.email || '(sem email)' })));
            console.log('[Login] Credencial digitada:', rawCred, '| Normalizada:', credNorm);

            // 3. Busca flexível: slug exato, slug parcial, email, nome parcial, id
            const partner = partnersList.find(p => {
                const pSlug = (p.slug || '').toLowerCase().trim();
                const pNome = normalize(p.nome || '');
                const pEmail = (p.email || '').toLowerCase().trim();
                const pId = (p.id || '').toLowerCase().trim();

                // Slug exato
                if (pSlug && pSlug === credLower) return true;
                if (pSlug && pSlug === credNorm) return true;

                // Email exato
                if (pEmail && pEmail === credLower) return true;

                // Nome parcial (digitou parte do nome)
                if (pNome && pNome.includes(normalize(rawCred))) return true;

                // ID exato
                if (pId && pId === credLower) return true;

                // Slug contém a credencial
                if (pSlug && pSlug.includes(credNorm) && credNorm.length >= 3) return true;

                return false;
            });

            btn.textContent = '🔑 Entrar no Painel';
            btn.disabled = false;

            if (partner) {
                const partnerSenha = (partner.senha || '').trim();
                if (partnerSenha !== "" && partnerSenha !== inputPass) {
                    btn.textContent = '🔑 Entrar no Painel';
                    btn.disabled = false;
                    errEl.innerText = "❌ Senha incorreta. Tente novamente.";
                    errEl.style.display = 'block';
                    return;
                }

                const sessionData = {
                    partnerId: partner.id,
                    partnerSlug: partner.slug,
                    partnerNome: partner.nome,
                    whatsapp: partner.whatsapp || '',
                    desconto: (partner.desconto !== undefined && partner.desconto !== null && !isNaN(parseFloat(partner.desconto))) ? parseFloat(partner.desconto) : 5,
                    loginAt: Date.now(),
                    expireAt: Date.now() + (24 * 60 * 60 * 1000) // 24 horas
                };
                localStorage.setItem('rota_partner_session', JSON.stringify(sessionData));
                window.location.href = 'parceiro-painel.html';
            } else {
                // Mostra os slugs disponíveis para ajudar o usuário
                const slugsDisponiveis = partnersList.map(p => p.slug).filter(Boolean).join(', ');
                const totalEncontrados = partnersList.length;

                let mensagem = `❌ Código ou nome "${rawCred}" não encontrado.`;

                if (totalEncontrados === 0) {
                    mensagem += `\n\n⚠️ Nenhum parceiro cadastrado no sistema ainda. Acesse o Painel Administrativo e cadastre o parceiro primeiro.`;
                } else {
                    mensagem += `\n\n✅ Parceiros cadastrados (${totalEncontrados}): ${slugsDisponiveis || '(sem código)'}`;
                    mensagem += `\n\nDica: Digite exatamente o "Código do Link" que aparece no campo (?ref=) ao cadastrar o parceiro no admin.`;
                }

                errEl.innerHTML = mensagem.replace(/\n/g, '<br>');
                errEl.style.display = 'block';
            }
        }
    </script>
</body>
</html>
